name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rce_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rce_crm_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rce_crm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (pushes schema + seeds via globalSetup)
        run: npm run test

      # The field PWA is a separate npm package with its own vitest config, so the
      # root suite never covered it — the load-calc, scoring and schema tests were
      # running nowhere. It needs no database.
      - name: Install field PWA dependencies
        run: npm --prefix field ci

      - name: Run field PWA test suite
        run: npm --prefix field run test

      - name: Build (client + prisma generate + server tsc)
        run: npm run build
