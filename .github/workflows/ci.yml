name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rce_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rce_crm_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rce_crm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (pushes schema + seeds via globalSetup)
        run: npm run test

      # The client CRM is a separate npm package with its own vitest project
      # (Phase A, 2026-09-20 "drawers and tab purpose" plan) — before this the
      # client had zero rendering tests: no jsdom, no testing-library, no test
      # runner at all. It needs no database; API responses are mocked.
      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run client render test suite
        run: npm --prefix client run test

      # The field PWA is a separate npm package with its own vitest config, so the
      # root suite never covered it — the load-calc, scoring and schema tests were
      # running nowhere. It needs no database.
      - name: Install field PWA dependencies
        run: npm --prefix field ci

      - name: Run field PWA test suite
        run: npm --prefix field run test

      # Reporting only, not gating: `npm run lint` (client + field) currently has
      # 44 + 17 = 61 pre-existing errors (mostly react-hooks/set-state-in-effect),
      # none from this change. Phase A adds this step so lint runs in CI for the
      # first time instead of never; failing the build on 61 pre-existing errors
      # is a separate cleanup this plan explicitly did not authorize.
      - name: Lint (client + field) — reporting only, see comment above
        run: npm run lint
        continue-on-error: true

      - name: Build (client + prisma generate + server tsc)
        run: npm run build
